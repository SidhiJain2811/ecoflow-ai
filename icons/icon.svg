<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324"/>
      <stop offset="100%" stop-color="#0d233a"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="plumeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e3a5f" stroke-width="6"/>

  <!-- Plume Wave Trail -->
  <path d="M 120 180 Q 220 120 300 200 T 420 340" fill="none" stroke="url(#plumeGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" opacity="0.6"/>

  <!-- Water Droplet Logo Core -->
  <path d="M 256 96 C 256 96 156 250 156 330 C 156 385 201 430 256 430 C 311 430 356 385 356 330 C 356 250 256 96 256 96 Z" fill="url(#dropGrad)" filter="url(#glow)"/>

  <!-- Inner Radar / Sensor Pulse Rings -->
  <circle cx="256" cy="330" r="42" fill="none" stroke="#5eead4" stroke-width="5" stroke-dasharray="8 6"/>
  <circle cx="256" cy="330" r="16" fill="#f8fafc"/>

  <!-- Top Warning Pulse -->
  <circle cx="120" cy="180" r="14" fill="#ef4444"/>
  <circle cx="120" cy="180" r="24" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.7"/>
</svg>
